[package]
name = "seiza-mac-core"
version = "0.9.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = "=0.50.0"
seiza = "=0.50.0"
tempfile = "3"
seiza-download = "=0.9.1"
seiza-fits = "=0.8.1"
seiza-image-io = "=0.13.1"
serde = { version = "1", features = ["derive"] }
seiza-stacking = "=0.58.0"
seiza-stretch = "=0.3.3"
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
