[package]
name = "seiza-mac-core"
version = "0.8.9"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza-calibration = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
fs2 = "0.4"
tempfile = "3"
seiza-download = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza-fits = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza-image-io = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
serde = { version = "1", features = ["derive"] }
seiza-stacking = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza-stretch = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
seiza-xisf = { git = "https://github.com/theatrus/seiza", rev = "366018752b2b0ab2c55c88f33bc606fb1060d4ba" }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
