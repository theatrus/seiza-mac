[package]
name = "seiza-mac-core"
version = "0.8.9"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza-calibration = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
fs2 = "0.4"
tempfile = "3"
seiza-download = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza-fits = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza-image-io = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
serde = { version = "1", features = ["derive"] }
seiza-stacking = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza-stretch = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
seiza-xisf = { git = "https://github.com/theatrus/seiza", rev = "d70c80d26442933d3bbbc30f533bdf7e18ed1673" }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
