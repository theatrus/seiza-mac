[package]
name = "seiza-mac-core"
version = "0.8.3"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = { git = "https://github.com/theatrus/seiza", rev = "b8ebe99b11ca05716a3b2314d5395d495ba05d8a" }
seiza = { git = "https://github.com/theatrus/seiza", rev = "b8ebe99b11ca05716a3b2314d5395d495ba05d8a" }
seiza-download = { git = "https://github.com/theatrus/seiza", rev = "b8ebe99b11ca05716a3b2314d5395d495ba05d8a" }
seiza-parallax = { git = "https://github.com/theatrus/seiza", rev = "b8ebe99b11ca05716a3b2314d5395d495ba05d8a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
