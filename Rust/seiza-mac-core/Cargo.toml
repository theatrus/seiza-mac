[package]
name = "seiza-mac-core"
version = "0.8.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = "=0.30.1"
seiza = "=0.30.1"
seiza-download = "=0.8.0"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
