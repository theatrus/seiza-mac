[package]
name = "seiza-mac-core"
version = "0.8.9"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
seiza = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
tempfile = "3"
seiza-download = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
seiza-fits = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
seiza-image-io = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
serde = { version = "1", features = ["derive"] }
seiza-stacking = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
seiza-stretch = { git = "https://github.com/theatrus/seiza", rev = "723fb702eb01283ddf0343a7217f7a987f0d709a" }
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
