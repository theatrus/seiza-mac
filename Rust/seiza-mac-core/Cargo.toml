[package]
name = "seiza-mac-core"
version = "0.8.7"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
seiza-cabi = "=0.44.2"
seiza = "=0.44.2"
seiza-download = "=0.9.0"
seiza-fits = "=0.6.0"
seiza-image-io = "=0.11.0"
serde = { version = "1", features = ["derive"] }
seiza-stacking = "=0.51.2"
seiza-stretch = "=0.3.2"
seiza-xisf = "=0.7.0"
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
