name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: seiza-mac
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Validate project metadata
        run: |
          plutil -lint App/Info.plist App/Seiza.entitlements
          plutil -lint QuickLook/Info.plist QuickLook/SeizaQuickLook.entitlements
          plutil -lint Thumbnail/Info.plist
          xcodebuild -project Seiza.xcodeproj -list

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Swift unit tests and native app integration build
        run: |
          xcodebuild test \
            -project Seiza.xcodeproj \
            -scheme Seiza \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Seiza-tests.xcresult" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Report native test failure details
        if: failure()
        run: |
          result_bundle="$RUNNER_TEMP/Seiza-tests.xcresult"
          if [[ -d "$result_bundle" ]]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" ||
              xcrun xcresulttool get --legacy --format json --path "$result_bundle"
          fi

      - name: Build universal Release app
        run: |
          xcodebuild build \
            -project Seiza.xcodeproj \
            -scheme Seiza \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64'
          scripts/validate-unsigned-app.sh DerivedData/Build/Products/Release/Seiza.app

      - name: Package and verify development DMG
        run: |
          # Retain target for Rust caching; the app no longer needs linked inputs.
          rm -rf .build/rust DerivedData/Build/Intermediates.noindex
          df -h .
          scripts/package-dmg.sh \
            DerivedData/Build/Products/Release/Seiza.app \
            dist/Seiza-development.dmg \
            development
          hdiutil verify dist/Seiza-development.dmg
