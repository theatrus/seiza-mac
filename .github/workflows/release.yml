name: Release DMG

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  dmg:
    if: github.repository == 'theatrus/seiza-mac' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: signing
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: seiza-mac
          save-if: false

      - name: Validate tag and test Rust core
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          marketing_version="$(
            xcodebuild \
              -project Seiza.xcodeproj \
              -scheme Seiza \
              -configuration Release \
              -showBuildSettings \
              | awk '/MARKETING_VERSION/ { print $3; exit }'
          )"
          test "$version" = "$marketing_version"
          build_version="$(
            xcodebuild \
              -project Seiza.xcodeproj \
              -target Seiza \
              -configuration Release \
              -showBuildSettings \
              | awk '/CURRENT_PROJECT_VERSION/ { print $3; exit }'
          )"
          quicklook_build_version="$(
            xcodebuild \
              -project Seiza.xcodeproj \
              -target SeizaQuickLook \
              -configuration Release \
              -showBuildSettings \
              | awk '/CURRENT_PROJECT_VERSION/ { print $3; exit }'
          )"
          thumbnail_build_version="$(
            xcodebuild \
              -project Seiza.xcodeproj \
              -target SeizaThumbnail \
              -configuration Release \
              -showBuildSettings \
              | awk '/CURRENT_PROJECT_VERSION/ { print $3; exit }'
          )"
          [[ "$build_version" =~ ^[1-9][0-9]*$ ]]
          test "$build_version" = "$quicklook_build_version"
          test "$build_version" = "$thumbnail_build_version"

          latest_appcast="$RUNNER_TEMP/latest-appcast.xml"
          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            --output "$latest_appcast"; then
            previous_build="$(
              xmllint \
                --xpath 'string((//*[local-name()="version"])[1])' \
                "$latest_appcast"
            )"
            [[ "$previous_build" =~ ^[1-9][0-9]*$ ]]
            test "$build_version" -gt "$previous_build"
          fi
          cargo fmt --all --check
          cargo test --workspace --locked

      - name: Build universal Release app
        run: |
          xcodebuild build \
            -project Seiza.xcodeproj \
            -scheme Seiza \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64'

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"

          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/seiza-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          certificate_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$certificate_identity"
          printf 'CERT_ID=%s\n' "$certificate_identity" >> "$GITHUB_ENV"

      - name: Sign Sparkle, Quick Look extensions, and application
        run: |
          app_path="DerivedData/Build/Products/Release/Seiza.app"
          scripts/sign-app.sh \
            "$app_path" \
            QuickLook/SeizaQuickLook.entitlements \
            App/Seiza.entitlements \
            "$CERT_ID"

      - name: Notarize and staple application
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        run: |
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_PRIVATE"

          app_path="DerivedData/Build/Products/Release/Seiza.app"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          submission_path="$RUNNER_TEMP/Seiza-notarization.zip"
          printf '%s' "$APPLE_API_KEY_PRIVATE" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$submission_path"
          xcrun notarytool submit "$submission_path" \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Package signed release
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          scripts/package-dmg.sh \
            DerivedData/Build/Products/Release/Seiza.app \
            "dist/Seiza-${version}-universal.dmg" \
            "$version"
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Release/Seiza.app \
            "dist/Seiza-${version}-universal.zip"

      - name: Sign, notarize, and verify disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg_path="dist/Seiza-${version}-universal.dmg"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          codesign --force --timestamp --sign "$CERT_ID" "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "dist/Seiza-${version}-universal.dmg"
          codesign --verify --verbose=4 "$dmg_path"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

      - name: Prepare release notes and Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          version="${GITHUB_REF_NAME#v}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          screenshot_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/images"
          printf '%s\n' \
            '## Seiza for Mac' \
            '' \
            'This universal application and disk image are Developer ID signed, notarized by Apple, and stapled for normal Gatekeeper installation.' \
            '' \
            "### New in ${version}" \
            '' \
            '- Finder now shows stretched FITS and XISF image thumbnails without opening Seiza.' \
            '- A new build number makes macOS register the thumbnail extension and astronomy file types on install.' \
            '- Retina thumbnails now fill the icon frame while keeping the image aspect ratio.' \
            '- Finder and Space-bar Quick Look previews now keep the full image fitted to the window as it resizes.' \
            '' \
            "- [Download the universal DMG](${release_base}/Seiza-${version}-universal.dmg)" \
            "- [Download the zipped application](${release_base}/Seiza-${version}-universal.zip)" \
            "- [Verify SHA-256 checksums](${release_base}/SHA256SUMS.txt)" \
            '' \
            '- Universal macOS 15+ application (Apple silicon and Intel)' \
            '- FITS, XISF, JPEG, PNG, and TIFF viewing' \
            '- Filter-aware FITS and XISF directory stacking with calibration, progress, cancellation, and 32-bit FITS output' \
            '- Live full-precision stretch stacks and light deconvolution' \
            '- Automatic, polynomial, and radial-basis gradient correction with additive and multiplicative modes' \
            '- Explicit local plate solving, catalog overlays, and WCS export' \
            '- Managed catalog download, verification, installation, and repair in Settings' \
            '- 8- and 16-bit image export with optional overlays' \
            '- Finder content thumbnails and Quick Look previews for FITS and XISF' \
            '- Mixed-format folder browsing with cached thumbnails' \
            '- Signed in-app updates with user-controlled checks and installs' \
            '' \
            "![Seiza folder browser and live stretch editor](${screenshot_base}/seiza-directory-stretch.png)" \
            '' \
            "![Seiza plate-solved FITS view](${screenshot_base}/seiza-solved-overlays.png)" \
            > release-notes.md

          appcast_directory="$RUNNER_TEMP/sparkle-appcast"
          mkdir -p "$appcast_directory"
          cp "dist/Seiza-${version}-universal.zip" "$appcast_directory/"
          cp release-notes.md "$appcast_directory/Seiza-${version}-universal.md"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
                --ed-key-file - \
                --download-url-prefix "${release_base}/" \
                --embed-release-notes \
                --maximum-deltas 0 \
                -o "$PWD/dist/appcast.xml" \
                "$appcast_directory"
          plutil -extract SUPublicEDKey raw \
            DerivedData/Build/Products/Release/Seiza.app/Contents/Info.plist \
            | grep -qx 'Jk4K7QO9ohQbi455S888/lnSiqXB6a5sB4wEuEZjaQ0='
          grep -q "url=\"${release_base}/Seiza-${version}-universal.zip\"" \
            dist/appcast.xml

      - name: Produce checksums
        run: |
          (
            cd dist
            shasum -a 256 Seiza-* appcast.xml > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Seiza for Mac ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/Seiza-* \
            dist/appcast.xml \
            dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          security delete-keychain "$RUNNER_TEMP/seiza-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          rm -f "$RUNNER_TEMP/Seiza-notarization.zip"
